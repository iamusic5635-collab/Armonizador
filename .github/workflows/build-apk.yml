name: Compilar APK Android

on:
workflow_dispatch:
push:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar código del repositorio
uses: actions/checkout@v4

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Instalar Capacitor y generar proyecto Android
    run: |
      npm install
      npx cap init "Estudio Vocal" "com.estudio.vocal" --web-dir=www
      npx cap add android

  - name: Aplicar imagen externa como ícono de la app (si existe assets/app-icon.png)
    run: |
      if [ -f "assets/app-icon.png" ]; then
        sudo apt-get update && sudo apt-get install -y imagemagick
        rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        magick "assets/app-icon.png" -auto-orient -resize 1024x1024 -background "#090b10" -gravity center -extent 1024x1024 -alpha off PNG24:/tmp/icon-square.png || \
        convert "assets/app-icon.png" -auto-orient -resize 1024x1024 -background "#090b10" -gravity center -extent 1024x1024 -alpha off PNG24:/tmp/icon-square.png

        for d in android/app/src/main/res/mipmap-*; do
          case "$d" in
            *mdpi) size=48 ;;
            *hdpi) size=72 ;;
            *xhdpi) size=96 ;;
            *xxhdpi) size=144 ;;
            *xxxhdpi) size=192 ;;
            *) size=192 ;;
          esac
          cp /tmp/icon-square.png "$d/ic_launcher.png"
          mogrify -resize "${size}x${size}" "$d/ic_launcher.png"
          cp "$d/ic_launcher.png" "$d/ic_launcher_round.png"
          if [ -f "$d/ic_launcher_foreground.png" ]; then
            cp "$d/ic_launcher.png" "$d/ic_launcher_foreground.png"
          fi
        done
      fi

  - name: Agregar permisos de micrófono y almacenamiento en AndroidManifest.xml
    run: |
      sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

  - name: Compilar APK con Gradle
    run: |
      npx cap sync android
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Subir APK lista para descargar
    uses: actions/upload-artifact@v4
    with:
      name: Estudio-Vocal-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
